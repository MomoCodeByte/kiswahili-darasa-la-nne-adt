<!DOCTYPE html>
<html lang="sw-TZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiswahili Darasa la Nne - Kitabu Asili</title>
  <style>
    :root { color-scheme: light; font-family: "Atkinson Hyperlegible", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e7eb; color: #111827; }
    header {
      position: sticky; top: 0; z-index: 10; display: flex; gap: .75rem;
      align-items: center; justify-content: center; flex-wrap: wrap;
      padding: .65rem 1rem; background: #172554; color: white;
      box-shadow: 0 2px 12px #0004;
    }
    header a, header button {
      border: 1px solid #ffffff55; border-radius: .55rem; background: #1e3a8a;
      color: white; padding: .55rem .8rem; font: inherit; font-weight: 700;
      text-decoration: none; cursor: pointer;
    }
    header button:disabled { opacity: .45; cursor: not-allowed; }
    label { font-weight: 700; }
    input { width: 5.5rem; padding: .45rem; border: 0; border-radius: .4rem; font: inherit; }
    main { padding: 1rem 1rem 5rem; }
    figure {
      margin: 0 auto; width: min(100%, 760px); background: white;
      box-shadow: 0 8px 30px #0003;
    }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: .65rem; text-align: center; font-weight: 700; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <header aria-label="Urambazaji wa kitabu asili">
    <a id="accessible-link" href="index.html">Rudi ADT inayofikika</a>
    <button id="previous" type="button">Ukurasa uliopita</button>
    <label for="page-number">Ukurasa</label>
    <input id="page-number" type="number" min="1" max="136" value="1" inputmode="numeric">
    <span>/ 136</span>
    <button id="next" type="button">Ukurasa unaofuata</button>
  </header>
  <main>
    <h1 class="sr-only">Kiswahili Kitabu cha Mwanafunzi Darasa la Nne - mwonekano wa PDF asili</h1>
    <figure aria-live="polite">
      <img id="page-image" src="images/original-pages/pg001.jpg" alt="Ukurasa wa 1 wa kitabu asili">
      <figcaption id="caption">Ukurasa wa 1</figcaption>
    </figure>
  </main>
  <script>
    (() => {
      const total = 136;
      const input = document.querySelector('#page-number');
      const image = document.querySelector('#page-image');
      const caption = document.querySelector('#caption');
      const previous = document.querySelector('#previous');
      const next = document.querySelector('#next');
      const accessibleLink = document.querySelector('#accessible-link');

      function pageFromHash() {
        const match = location.hash.match(/page=(\d+)/);
        return match ? Number(match[1]) : 1;
      }
      function clamp(value) { return Math.min(total, Math.max(1, Number(value) || 1)); }
      function accessibleHref(page) {
        return page === 1 ? 'index.html' : `pg${String(page).padStart(3, '0')}_sec001.html`;
      }
      function show(value, updateHash = true) {
        const page = clamp(value);
        input.value = page;
        image.src = `images/original-pages/pg${String(page).padStart(3, '0')}.jpg`;
        image.alt = `Ukurasa wa ${page} wa kitabu asili`;
        caption.textContent = `Ukurasa wa ${page}`;
        previous.disabled = page === 1;
        next.disabled = page === total;
        accessibleLink.href = accessibleHref(page);
        if (updateHash) history.replaceState(null, '', `#page=${page}`);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      previous.addEventListener('click', () => show(Number(input.value) - 1));
      next.addEventListener('click', () => show(Number(input.value) + 1));
      input.addEventListener('change', () => show(input.value));
      window.addEventListener('hashchange', () => show(pageFromHash(), false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') show(Number(input.value) - 1);
        if (event.key === 'ArrowRight') show(Number(input.value) + 1);
      });
      show(pageFromHash(), false);
    })();
  </script>
</body>
</html>
